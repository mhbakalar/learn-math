<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Miles &amp; Me: Math Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root { --ui: 'Fredoka', 'Avenir Next', 'Trebuchet MS', system-ui, sans-serif; --pix: 'Press Start 2P', monospace; --cream:#f6e7b0; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; height:100%; overflow:hidden; background:#000; overscroll-behavior:none; touch-action:none;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; font-family:var(--ui); }
canvas#game { position:fixed; inset:0; width:100vw; height:100vh; display:block; image-rendering:pixelated; }
.hidden { display:none !important; }
button { font-family:var(--ui); touch-action:manipulation; cursor:pointer; }
.panel { background:rgba(24,18,48,.82); border:3px solid var(--cream); border-radius:16px; color:#fff; box-shadow:0 5px 0 rgba(0,0,0,.35); }

/* HUD */
#hud { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start;
  padding: calc(env(safe-area-inset-top) + 10px) 12px 0; pointer-events:none; z-index:5; gap:8px; }
#hudLeft { display:flex; flex-wrap:wrap; gap:4px 14px; align-items:center; padding:6px 14px; font-size:22px; font-weight:600; }
#hearts { font-size:20px; letter-spacing:1px; }
#hudRight { display:flex; gap:8px; align-items:center; pointer-events:auto; }
#lvlBadge { padding:6px 12px; font-size:15px; text-align:right; line-height:1.2; min-width:150px; }
#lvlBadge b { font-size:20px; color:#ffd84a; }
.bar { height:7px; background:rgba(255,255,255,.2); border-radius:4px; margin-top:4px; overflow:hidden; }
.bar > div { height:100%; background:linear-gradient(90deg,#ffd84a,#ff8a3d); width:0; transition:width .5s; }
.iconBtn { width:54px; height:54px; font-size:26px; display:flex; align-items:center; justify-content:center; padding:0; }

/* Joystick */
#joy { position:fixed; width:130px; height:130px; margin:-65px 0 0 -65px; border-radius:50%; background:rgba(255,255,255,.14);
  border:3px solid rgba(255,255,255,.55); pointer-events:none; z-index:4; }
#joyKnob { position:absolute; left:50%; top:50%; width:58px; height:58px; margin:-29px 0 0 -29px; border-radius:50%;
  background:rgba(255,255,255,.75); box-shadow:0 3px 0 rgba(0,0,0,.25); }
#touchHint { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 24px); transform:translateX(-50%);
  padding:10px 20px; font-size:20px; z-index:4; pointer-events:none; animation: pulse 1.6s infinite; white-space:nowrap; }
@keyframes pulse { 50% { opacity:.6; } }
@keyframes bob { 50% { transform:translateY(4px); } }

/* Speech bubble */
#bubble { position:fixed; z-index:6; transform:translate(-50%,-100%); background:#fff; color:#2a2150; font-size:18px; font-weight:600;
  padding:6px 12px; border-radius:14px; border:3px solid #2a2150; pointer-events:none; white-space:nowrap; }
#bubble::after { content:''; position:absolute; left:50%; bottom:-11px; margin-left:-8px; border:8px solid transparent; border-top-color:#2a2150; border-bottom:0; }

/* Dialog */
#dialog { position:fixed; inset:0; z-index:20; display:flex; align-items:flex-end; justify-content:center;
  padding:0 16px calc(env(safe-area-inset-bottom) + 18px); }
#dlgBox { width:min(920px,100%); position:relative; padding:22px 26px 30px; font-size:clamp(20px,2.6vw,26px); line-height:1.4; min-height:120px; }
#dlgName { position:absolute; top:-20px; left:20px; background:#ff6fa8; color:#fff; padding:3px 16px; border-radius:12px;
  border:3px solid var(--cream); font-weight:700; font-size:18px; }
#dlgNext { position:absolute; right:18px; bottom:8px; color:#ffd84a; font-size:18px; animation:bob .8s infinite; }

/* Toast */
#toast { position:fixed; left:50%; top:calc(env(safe-area-inset-top) + 84px); transform:translateX(-50%); z-index:25;
  padding:10px 22px; font-size:22px; font-weight:600; pointer-events:none; opacity:0; transition:opacity .3s; text-align:center; max-width:90vw; }
#toast.show { opacity:1; }

/* Battle */
#bEnemy { position:fixed; top:calc(env(safe-area-inset-top) + 10px); left:50%; transform:translateX(-50%); padding:6px 18px 8px;
  font-size:20px; font-weight:700; z-index:10; text-align:center; min-width:220px; }
#bEnemy .bar { height:10px; } #bEnemy .bar > div { background:linear-gradient(90deg,#ff5d6c,#ff9a5a); }
#battleUI { position:fixed; left:0; right:0; bottom:0; z-index:10; padding:10px 16px calc(env(safe-area-inset-bottom) + 12px);
  background:linear-gradient(rgba(42,33,80,.96),rgba(26,20,54,.98)); border-top:4px solid var(--cream); color:#fff; }
#bTop { display:flex; justify-content:space-between; align-items:center; font-size:20px; font-weight:600; gap:10px; }
#bStreak { color:#ffb347; }
#bQuestion { font-size:clamp(24px,3.8vw,40px); font-weight:700; text-align:center; margin:4px auto 8px; line-height:1.3; max-width:1000px; }
#bVisual { text-align:center; font-size:clamp(22px,3vw,32px); margin-bottom:6px; }
#bVisual:empty { display:none; }
#bChoices { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; max-width:1100px; margin:0 auto; }
@media (max-aspect-ratio: 1/1) { #bChoices { grid-template-columns:repeat(2,1fr); } }
.choice { min-height:74px; font-size:clamp(22px,3.4vw,34px); font-weight:700; border-radius:18px; border:none; background:#fff6dc;
  color:#2a2150; box-shadow:0 6px 0 #c9a85a; padding:6px; transition:opacity .25s; }
.choice:active { transform:translateY(4px); box-shadow:0 2px 0 #c9a85a; }
.choice.correct { background:#7ee07e; box-shadow:0 6px 0 #3a9a3a; }
.choice.wrong { background:#ff8a8a; box-shadow:0 6px 0 #b04040; }
.choice.gone { opacity:.2; pointer-events:none; }
#bFeedback { min-height:30px; text-align:center; font-size:clamp(18px,2.4vw,24px); margin-top:10px; line-height:1.35; }
#bFeedback .good { color:#8dff8d; font-weight:700; }
#bFeedback .explain { color:#bfe9ff; }
#bFeedback .hv { font-size:28px; margin-top:4px; }
#bActions { display:flex; gap:12px; justify-content:center; margin-top:10px; flex-wrap:wrap; }
.act { font-size:20px; padding:10px 20px; border-radius:14px; border:3px solid var(--cream); background:#6a4ec0; color:#fff; font-weight:600; min-height:54px; }
.act:active { transform:translateY(2px); }
.act.go { background:#2fa84f; font-size:24px; padding:10px 40px; }
.act.run { background:#555a78; }
.frac { display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; line-height:1.05; font-size:.8em; margin:0 3px; }
.frac span:first-child { border-bottom:3px solid currentColor; padding:0 4px 1px; }
.frac span:last-child { padding:1px 4px 0; }
.blank { display:inline-block; min-width:1.3em; border-bottom:4px solid #ffd84a; color:#ffd84a; }
.objs { letter-spacing:2px; }
.crossed { opacity:.35; }

/* Overlays */
.overlay { position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center; background:rgba(10,8,30,.5); padding:16px; }
.card { width:min(580px,100%); padding:26px 24px; text-align:center; max-height:100%; overflow:auto; }
.logo { font-family:var(--pix); font-size:clamp(24px,5vw,42px); color:#ffd84a; text-shadow:3px 3px 0 #c0392b, 6px 6px 0 rgba(0,0,0,.4); line-height:1.35; }
.logo span { color:#ff7eb6; }
.sub { font-family:var(--pix); font-size:clamp(11px,2vw,16px); color:#bfe9ff; margin:12px 0 22px; letter-spacing:2px; }
.big { display:block; width:100%; margin:12px 0; font-size:26px; font-weight:700; padding:14px; border-radius:18px; border:3px solid var(--cream);
  background:#ff6fa8; color:#fff; box-shadow:0 6px 0 #b0406a; }
.big.alt { background:#4a8fe0; box-shadow:0 6px 0 #2a5a9a; }
.big.gray { background:#555a78; box-shadow:0 6px 0 #33364a; }
.big:active { transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.3); }
.nameRow { font-size:20px; margin-bottom:8px; }
#nameIn { font-family:var(--ui); font-size:24px; padding:8px 14px; border-radius:12px; border:3px solid var(--cream); width:220px; text-align:center;
  margin-left:8px; -webkit-user-select:text; user-select:text; }
.q { font-size:24px; font-weight:700; margin-bottom:14px; }
.grades { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.grades button { font-size:19px; padding:14px 8px; border-radius:14px; border:3px solid var(--cream); background:#6a4ec0; color:#fff; font-weight:600; }
.small { font-size:16px; opacity:.85; margin-top:14px; }
.stats { font-size:19px; line-height:1.6; margin:10px 0; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="hudLeft" class="panel"><span id="hearts"></span><span id="honey"></span><span id="stars"></span></div>
  <div id="hudRight">
    <div id="lvlBadge" class="panel"></div>
    <button id="btnMenu" class="panel iconBtn" aria-label="Menu">⚙️</button>
  </div>
</div>

<div id="joy" class="hidden"><div id="joyKnob"></div></div>
<div id="touchHint" class="panel hidden">👆 Touch &amp; drag anywhere to walk</div>
<div id="bubble" class="hidden"></div>
<div id="toast" class="panel"></div>

<div id="dialog" class="hidden">
  <div id="dlgBox" class="panel"><div id="dlgName"></div><div id="dlgText"></div><div id="dlgNext">▼ tap</div></div>
</div>

<div id="bEnemy" class="panel hidden"><div id="bEnemyName"></div><div class="bar"><div id="bEnemyHp"></div></div></div>
<div id="battleUI" class="hidden">
  <div id="bTop"><span id="bHearts"></span><span id="bStreak"></span></div>
  <div id="bQuestion"></div>
  <div id="bVisual"></div>
  <div id="bChoices"></div>
  <div id="bFeedback"></div>
  <div id="bActions">
    <button id="btnHelp" class="act">🐻 Miles, help!</button>
    <button id="btnRun" class="act run">🏃 Run</button>
    <button id="btnGo" class="act go hidden">Got it! ▶</button>
  </div>
</div>

<div id="title" class="overlay">
  <div class="card panel">
    <div class="logo">Miles <span>&amp;</span> Me</div>
    <div class="sub">★ MATH QUEST ★</div>
    <div id="titleMain">
      <div class="nameRow">Hero's name: <input id="nameIn" maxlength="12" value="Lehvi" autocomplete="off"></div>
      <button id="btnContinue" class="big alt hidden">▶ Continue</button>
      <button id="btnNew" class="big">✨ New Adventure</button>
    </div>
    <div id="gradePick" class="hidden">
      <div class="q">Where should we start?</div>
      <div class="grades" id="grades"></div>
      <div class="small">Don't worry, the game gets easier or harder as you play!</div>
      <button id="btnGradeBack" class="big gray" style="margin-top:16px">Back</button>
    </div>
  </div>
</div>

<div id="menu" class="overlay hidden">
  <div class="card panel">
    <div class="q">⏸ Paused</div>
    <div class="stats" id="menuStats"></div>
    <button id="mResume" class="big alt">▶ Keep playing</button>
    <button id="mSound" class="big gray"></button>
    <button id="mMusic" class="big gray"></button>
    <button id="mLevel" class="big gray">📚 Change math level</button>
    <button id="mNew" class="big">🔄 New adventure</button>
  </div>
</div>

<div id="victory" class="overlay hidden">
  <div class="card panel">
    <div class="logo">YOU WIN!</div>
    <div class="sub">👑 THE GOLDEN CROWN IS YOURS 👑</div>
    <div class="stats" id="winStats"></div>
    <button id="vKeep" class="big alt">🌳 Keep exploring</button>
    <button id="vNew" class="big">✨ New adventure</button>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);

// =====================================================================
// Utilities
// =====================================================================
const R = Math.random;
const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
const pick = a => a[Math.floor(R() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return (h ^ (h >>> 16)) >>> 0; }

// =====================================================================
// Math problems: 25 levels from counting to SAT
// =====================================================================
const N = v => { const r = Math.round(v * 1000) / 1000; return r < 0 ? '−' + Math.abs(r) : String(r); };
const P = v => v < 0 ? `(${N(v)})` : String(v);
const fr = (n, d) => `<span class="frac"><span>${n}</span><span>${d}</span></span>`;
const sq = s => `${s}<sup>2</sup>`;
const objs = (n, e) => n > 0 ? `<span class="objs">${e.repeat(n)}</span>` : '';
const FRUITS = ['🍎', '🍓', '🍪', '⭐', '🐟', '🌸', '🍯'];

function numP(q, ans, o = {}) {
  const fmt = o.fmt || N, step = o.step || 1, spread = o.spread || 3, min = o.min ?? -1e9;
  const vals = [ans];
  const tryAdd = v => { v = Math.round(v * 1000) / 1000; if (v < min || !isFinite(v) || vals.some(x => Math.abs(x - v) < 1e-9)) return; vals.push(v); };
  for (const w of shuffle((o.wrong || []).slice())) { if (vals.length >= 4) break; tryAdd(w); }
  let g = 0; while (vals.length < 4 && g++ < 100) tryAdd(ans + ri(1, spread) * step * (R() < .5 ? -1 : 1));
  let k = 1; while (vals.length < 4) tryAdd(ans + step * (spread + k++));
  return { q, answer: fmt(ans), choices: shuffle(vals.map(fmt)), hint: o.hint || '', explain: o.explain || '', visual: o.visual || '', hintVisual: o.hintVisual || '' };
}
function strP(q, ans, wrongs, o = {}) {
  const out = [ans];
  for (const w of shuffle(wrongs.slice())) { if (out.length >= 4) break; if (!out.includes(w)) out.push(w); }
  return { q, answer: ans, choices: shuffle(out), hint: o.hint || '', explain: o.explain || '', visual: o.visual || '', hintVisual: o.hintVisual || '' };
}

const gen = {
  add: max => () => {
    const s = ri(Math.min(2, max), max), a = ri(0, s), b = s - a, e = pick(FRUITS);
    return numP(`${a} + ${b} = ?`, s, { min: 0, wrong: [s + 1, s - 1, Math.abs(a - b)],
      hint: `Start at ${Math.max(a, b)} and count up ${Math.min(a, b)} more.`, explain: `${a} + ${b} = ${s}`,
      visual: max <= 10 ? `${objs(a, e)} <b>+</b> ${objs(b, e)}` : '', hintVisual: s <= 20 ? objs(s, e) : '' });
  },
  sub: max => () => {
    const a = ri(2, max), b = ri(0, a), d = a - b, e = pick(FRUITS);
    return numP(`${a} − ${b} = ?`, d, { min: 0, wrong: [a + b, d + 1, d - 1],
      hint: `Start at ${a} and count back ${b}.`, explain: `${a} − ${b} = ${d}`,
      hintVisual: a <= 15 ? `${objs(d, e)}<span class="crossed">${objs(b, e)}</span>` : '' });
  },
  missing: max => () => {
    const s = ri(3, max), a = ri(0, s), b = s - a;
    return numP(`${a} + <span class="blank">?</span> = ${s}`, b, { min: 0, wrong: [s + a, s, b + 1, b - 1],
      hint: `What do you add to ${a} to make ${s}? Count up from ${a} to ${s}.`, explain: `${a} + ${b} = ${s}` });
  },
  compare: () => {
    const tens = ri(1, 9), nums = new Set();
    while (nums.size < 4) nums.add(R() < .6 ? tens * 10 + ri(0, 9) : ri(10, 99));
    const arr = [...nums], big = R() < .5, ans = big ? Math.max(...arr) : Math.min(...arr);
    return { q: `Which number is the ${big ? 'BIGGEST' : 'SMALLEST'}?`, answer: String(ans), choices: shuffle(arr.map(String)),
      hint: 'Look at the tens digit first. If they match, look at the ones digit.', explain: `${ans} is the ${big ? 'biggest' : 'smallest'}.`, visual: '', hintVisual: '' };
  },
  skip: () => {
    const st = pick([2, 5, 10, 3, 4]), start = st * ri(0, 5), seq = [0, 1, 2, 3].map(i => start + st * i), ans = start + st * 4;
    return numP(`${seq.join(', ')}, <span class="blank">?</span>`, ans, { min: 0, wrong: [ans + 1, ans - 1, ans + st],
      hint: `Each number goes up by ${st}.`, explain: `Counting by ${st}s: ${seq[3]} + ${st} = ${ans}` });
  },
  add2: regroup => () => {
    let a, b; do { a = ri(10, 89); b = ri(10, 99 - a); } while (regroup !== ((a % 10) + (b % 10) >= 10));
    const s = a + b;
    return numP(`${a} + ${b} = ?`, s, { min: 0, wrong: [s - 10, s + 10, s + 1, s - 1],
      hint: `Add the ones first (${a % 10} + ${b % 10}), then the tens.${regroup ? ' Carry the extra ten!' : ''}`, explain: `${a} + ${b} = ${s}` });
  },
  sub2: regroup => () => {
    let a, b; do { a = ri(20, 99); b = ri(10, a - 1); } while (regroup !== ((a % 10) < (b % 10)));
    const d = a - b, oops = Math.abs((a % 10) - (b % 10)) + (Math.floor(a / 10) - Math.floor(b / 10)) * 10;
    return numP(`${a} − ${b} = ?`, d, { min: 0, wrong: [d + 10, d - 10, oops],
      hint: `Subtract the ones, then the tens.${regroup ? ` You can't take ${b % 10} from ${a % 10}, so borrow a ten!` : ''}`, explain: `${a} − ${b} = ${d}` });
  },
  place: () => {
    const n = ri(100, 999), d = [Math.floor(n / 100), Math.floor(n / 10) % 10, n % 10];
    if (R() < .5) {
      const w = ri(0, 2), names = ['hundreds', 'tens', 'ones'];
      return numP(`What digit is in the <b>${names[w]}</b> place of ${n}?`, d[w], { min: 0, wrong: [...d, d[w] * Math.pow(10, 2 - w)],
        hint: `In ${n} there are ${d[0]} hundreds, ${d[1]} tens, and ${d[2]} ones.`, explain: `The ${names[w]} digit is ${d[w]}.` });
    }
    return numP(`${d[0] * 100} + ${d[1] * 10} + ${d[2]} = ?`, n, { min: 0, wrong: [d[0] * 100 + d[2] * 10 + d[1], d[0] + d[1] + d[2], n + 10, n - 100],
      hint: 'Put the hundreds, tens and ones together.', explain: `= ${n}` });
  },
  mult: tables => () => {
    const a = pick(tables), b = ri(1, 10), p = a * b, [x, y] = R() < .5 ? [a, b] : [b, a];
    const counts = Array.from({ length: Math.min(b - 1, 3) }, (_, i) => a * (i + 1)).join(', ');
    return numP(`${x} × ${y} = ?`, p, { min: 0, wrong: [a * (b + 1), a * (b - 1), a + b, (a + 1) * b],
      hint: `${a} × ${b} means ${b} groups of ${a}.${b > 1 ? ` Skip count by ${a}: ${counts}, ... (${b} numbers in all)` : ''}`, explain: `${x} × ${y} = ${p}` });
  },
  div: () => {
    const b = ri(2, 10), q = ri(1, 10), a = b * q;
    return numP(`${a} ÷ ${b} = ?`, q, { min: 0, wrong: [q + 1, q - 1, a - b, b], hint: `Think: ${b} × ? = ${a}`, explain: `${b} × ${q} = ${a}, so ${a} ÷ ${b} = ${q}` });
  },
  wordMult: () => {
    const a = ri(3, 9), b = ri(3, 9);
    const t = pick([`Each basket holds ${a} apples. How many apples are in ${b} baskets?`,
      `Miles eats ${a} honey cakes every day. How many does he eat in ${b} days?`,
      `There are ${b} rows of chairs with ${a} chairs in each row. How many chairs?`]);
    return numP(t, a * b, { min: 0, wrong: [a + b, a * (b - 1), a * b + a], hint: `${b} groups of ${a} means ${b} × ${a}.`, explain: `${b} × ${a} = ${a * b}` });
  },
  wordDiv: () => {
    const b = ri(2, 9), q = ri(2, 9), a = b * q;
    const t = pick([`${a} stickers are shared equally by ${b} friends. How many does each friend get?`,
      `Miles has ${a} berries and puts ${b} in each bowl. How many bowls does he fill?`]);
    return numP(t, q, { min: 0, wrong: [q + 1, a - b, q - 1, b], hint: `${a} ÷ ${b} = ? Think: ${b} × ? = ${a}`, explain: `${a} ÷ ${b} = ${q}` });
  },
  fracName: () => {
    const d = pick([2, 3, 4, 6, 8]), n = ri(1, d - 1);
    return strP(`A pizza is cut into ${d} equal slices. You eat ${n}. What fraction did you eat?`, fr(n, d),
      [fr(d, n), fr(d - n, d), fr(n, d + n), fr(n + 1, d), fr(1, n + d)],
      { hint: `The bottom number is how many slices in all (${d}). The top is how many you ate (${n}).`, explain: `${n} out of ${d} slices`, hintVisual: objs(n, '🍕') + objs(d - n, '⚪') });
  },
  equivFrac: () => {
    const d = pick([2, 3, 4, 5]), n = ri(1, d - 1), k = ri(2, 4);
    return numP(`${fr(n, d)} = ${fr('?', d * k)}`, n * k, { min: 1, wrong: [n + k, n * k + 1, d * k - n, n * k - 1],
      hint: `${d} × ${k} = ${d * k}. Do the same thing to the top: ${n} × ${k}.`, explain: `${fr(n, d)} = ${fr(n * k, d * k)}` });
  },
  add3: () => {
    const a = ri(100, 899), b = ri(100, 999 - a), s = a + b;
    return numP(`${a} + ${b} = ?`, s, { min: 0, wrong: [s + 10, s - 10, s + 100, s - 100, s + 1], hint: 'Line up the digits. Add the ones, then tens, then hundreds.', explain: `${a} + ${b} = ${s}` });
  },
  sub3: () => {
    const a = ri(300, 999), b = ri(100, a - 50), d = a - b;
    return numP(`${a} − ${b} = ?`, d, { min: 0, wrong: [d + 10, d - 10, d + 100, d - 1], hint: 'Subtract the ones, then tens, then hundreds. Borrow if you need to!', explain: `${a} − ${b} = ${d}` });
  },
  mult21: () => {
    const a = ri(12, 98), b = ri(3, 9), p = a * b, t = Math.floor(a / 10) * 10, o = a % 10;
    return numP(`${a} × ${b} = ?`, p, { min: 0, wrong: [t * b + o, p + 10, p - 10, a * (b + 1), a * (b - 1)],
      hint: `Break it apart: ${t} × ${b} = ${t * b} and ${o} × ${b} = ${o * b}. Add them!`, explain: `${t * b} + ${o * b} = ${p}` });
  },
  round: () => {
    const to = pick([10, 100]), n = to === 10 ? ri(11, 99) : ri(101, 999);
    if (n % to === 0) return gen.round();
    const ans = Math.round(n / to) * to, other = Math.floor(n / to) * to === ans ? Math.ceil(n / to) * to : Math.floor(n / to) * to;
    return numP(`Round ${n} to the nearest ${to}.`, ans, { min: 0, wrong: [ans + to, ans - to, other], step: to,
      hint: `Look at the ${to === 10 ? 'ones' : 'tens'} digit. 5 or more rounds up!`, explain: `${n} rounds to ${ans}` });
  },
  area: () => {
    const w = ri(2, 12), h = ri(2, 12);
    return numP(`A rectangle is ${w} units long and ${h} units wide. What is its <b>area</b>?`, w * h, { min: 1, wrong: [2 * (w + h), w + h, w * h + w],
      hint: 'Area = length × width (the number of squares inside).', explain: `${w} × ${h} = ${w * h} square units` });
  },
  perim: () => {
    const w = ri(2, 15), h = ri(2, 15);
    return numP(`A rectangle is ${w} long and ${h} wide. What is its <b>perimeter</b>?`, 2 * (w + h), { min: 1, wrong: [w * h, w + h, 2 * w + h],
      hint: 'Perimeter = add up all 4 sides.', explain: `${w} + ${h} + ${w} + ${h} = ${2 * (w + h)}` });
  },
  fracAdd: () => {
    const d = pick([4, 5, 6, 8, 10, 12]), a = ri(1, d - 2), b = ri(1, d - 1 - a);
    return strP(`${fr(a, d)} + ${fr(b, d)} = ?`, fr(a + b, d), [fr(a + b, d * 2), fr(a * b, d), fr(a + b + 1, d), fr(Math.abs(a - b) || 1, d), fr(a + b, d + 1)],
      { hint: 'When the bottoms match, just add the tops! The bottom stays the same.', explain: `${a} + ${b} = ${a + b}, so it's ${a + b} over ${d}` });
  },
  fracOf: () => {
    const d = pick([2, 3, 4, 5, 10]), n = ri(1, d - 1), k = ri(2, 9), base = d * k;
    return numP(`What is ${fr(n, d)} of ${base}?`, n * k, { min: 0, wrong: [k, base - n * k, n * k + n, Math.floor(base / n)],
      hint: `First find ${fr(1, d)} of ${base}: ${base} ÷ ${d} = ${k}. Then multiply by ${n}.`, explain: `${base} ÷ ${d} × ${n} = ${n * k}` });
  },
  decAdd: () => {
    const a = ri(11, 99) / 10, b = ri(11, 99) / 10;
    if (R() < .4 && a > b) {
      const d = Math.round((a - b) * 10) / 10;
      return numP(`${a} − ${b} = ?`, d, { step: .1, min: 0, wrong: [d + 1, d - 1, d + .1], hint: 'Line up the decimal points, then subtract like normal.', explain: `${a} − ${b} = ${d}` });
    }
    const s = Math.round((a + b) * 10) / 10;
    return numP(`${a} + ${b} = ?`, s, { step: .1, min: 0, wrong: [s + 1, s - 1, s + .1, s - .1], hint: 'Line up the decimal points, then add like normal.', explain: `${a} + ${b} = ${s}` });
  },
  decCompare: () => {
    const a = ri(2, 8);
    const c = [a / 10, a / 10 + ri(1, 9) / 100, a / 100 + ri(0, 9) / 1000, (a - 1) / 10 + ri(5, 9) / 100, a / 10 + ri(1, 9) / 1000].map(v => Math.round(v * 1000) / 1000);
    const u = [...new Set(c)].slice(0, 4);
    while (u.length < 4) u.push(Math.round((u[u.length - 1] + 0.011) * 1000) / 1000);
    const ans = Math.max(...u);
    return { q: 'Which decimal is the GREATEST?', answer: String(ans), choices: shuffle(u.map(String)),
      hint: 'Compare the tenths digit first (right after the point), then the hundredths.', explain: `${ans} is the greatest.`, visual: '', hintVisual: '' };
  },
  longDiv: () => {
    const b = ri(2, 9), q = ri(11, 60), a = b * q, t = Math.floor(q / 10) * 10;
    return numP(`${a} ÷ ${b} = ?`, q, { min: 1, wrong: [q + 1, q - 1, q + 10, q - 10], hint: `How many ${b}s fit in ${a}? Try ${b} × ${t} = ${b * t} first.`, explain: `${b} × ${q} = ${a}` });
  },
  orderOps: () => {
    const a = ri(2, 9), b = ri(2, 9), c = ri(2, 9), t = ri(0, 3);
    if (t === 0) return numP(`${a} + ${b} × ${c} = ?`, a + b * c, { min: 0, wrong: [(a + b) * c], hint: 'Multiply before you add!', explain: `${b} × ${c} = ${b * c}, then ${a} + ${b * c} = ${a + b * c}` });
    if (t === 1) return numP(`(${a} + ${b}) × ${c} = ?`, (a + b) * c, { min: 0, wrong: [a + b * c], hint: 'Parentheses first!', explain: `${a} + ${b} = ${a + b}, then × ${c} = ${(a + b) * c}` });
    if (t === 2) { const d = ri(2, 6), k = ri(2, 9), big = d * k;
      return numP(`${a} × ${b} − ${big} ÷ ${d} = ?`, a * b - k, { wrong: [Math.trunc((a * b - big) / d), a * b + k], hint: 'Do × and ÷ first, then subtract.', explain: `${a * b} − ${k} = ${a * b - k}` }); }
    return numP(`${a * 2} − ${a} + ${b} = ?`, a + b, { wrong: [a * 2 - (a + b)], hint: 'Plus and minus go left to right.', explain: `${a * 2} − ${a} = ${a}, then + ${b} = ${a + b}` });
  },
  negAdd: () => {
    const a = ri(-12, 12), b = ri(-12, 12), plus = R() < .5, ans = plus ? a + b : a - b;
    return numP(`${N(a)} ${plus ? '+' : '−'} ${P(b)} = ?`, ans, { wrong: [-ans, plus ? a - b : a + b, ans + 2],
      hint: plus ? 'Adding a negative is like moving left on the number line.' : 'Subtracting a negative is the same as adding a positive!',
      explain: `${N(a)} ${plus ? '+' : '−'} ${P(b)} = ${N(ans)}` });
  },
  negMult: () => {
    const a = ri(-9, 9) || 3, b = ri(-9, 9) || -4;
    if (R() < .4) return numP(`${N(a * b)} ÷ ${P(b)} = ?`, a, { wrong: [-a, a + 1], hint: 'Same signs make a positive. Different signs make a negative.', explain: `${N(a * b)} ÷ ${P(b)} = ${N(a)}` });
    return numP(`${N(a)} × ${P(b)} = ?`, a * b, { wrong: [-a * b, a + b], hint: 'Same signs make a positive. Different signs make a negative.', explain: `${N(a)} × ${P(b)} = ${N(a * b)}` });
  },
  percentOf: () => {
    const p = pick([10, 20, 25, 50, 75]), base = pick([20, 40, 60, 80, 100, 120, 200]), ans = base * p / 100;
    if (!Number.isInteger(ans)) return gen.percentOf();
    const hints = { 10: '10% means divide by 10.', 20: '20% is 2 × 10%.', 25: '25% means one quarter. Divide by 4.', 50: '50% means half.', 75: '75% is three quarters. Find 25% and multiply by 3.' };
    return numP(`What is ${p}% of ${base}?`, ans, { min: 0, wrong: [base - ans, p, ans * 2, ans / 2], hint: hints[p], explain: `${p}% of ${base} = ${ans}` });
  },
  ratio: () => {
    const a = ri(1, 5), b = ri(2, 7), k = ri(2, 6);
    if (a === b) return gen.ratio();
    const [x, y] = pick([['cats', 'dogs'], ['red marbles', 'blue marbles'], ['apples', 'pears']]);
    return numP(`The ratio of ${x} to ${y} is ${a} : ${b}. If there are ${a * k} ${x}, how many ${y} are there?`, b * k, { min: 1, wrong: [a * k + b - a, b * k + k, a * b * k, b + k],
      hint: `${a} became ${a * k}, which is × ${k}. Do the same to ${b}.`, explain: `${b} × ${k} = ${b * k}` });
  },
  oneStep: () => {
    const x = ri(2, 15), a = ri(2, 12), t = ri(0, 3);
    if (t === 0) return numP(`x + ${a} = ${x + a}<br>What is x?`, x, { wrong: [x + 2 * a, x + a, x + 1], hint: `Subtract ${a} from both sides.`, explain: `x = ${x + a} − ${a} = ${x}` });
    if (t === 1) return numP(`x − ${a} = ${x}<br>What is x?`, x + a, { wrong: [x - a, x, x + a + 1], hint: `Add ${a} to both sides.`, explain: `x = ${x} + ${a} = ${x + a}` });
    if (t === 2) return numP(`${a}x = ${a * x}<br>What is x?`, x, { wrong: [a * x - a, a * x * a, x + 1], hint: `Divide both sides by ${a}.`, explain: `x = ${a * x} ÷ ${a} = ${x}` });
    return numP(`x ÷ ${a} = ${x}<br>What is x?`, a * x, { wrong: [x, a + x, a * x + a], hint: `Multiply both sides by ${a}.`, explain: `x = ${x} × ${a} = ${a * x}` });
  },
  twoStep: () => {
    const x = ri(-4, 12) || 5, a = ri(2, 9), b = ri(1, 20), neg = R() < .4, c = neg ? a * x - b : a * x + b;
    return numP(`${a}x ${neg ? '−' : '+'} ${b} = ${N(c)}<br>Solve for x.`, x, { wrong: [neg ? (c - b) / a : (c + b) / a, x + 1, -x, neg ? c + b : c - b].filter(Number.isInteger),
      hint: neg ? `First add ${b} to both sides, then divide by ${a}.` : `First subtract ${b} from both sides, then divide by ${a}.`,
      explain: `${a}x = ${N(neg ? c + b : c - b)}, so x = ${N(x)}` });
  },
  exponent: () => {
    const t = ri(0, 2);
    if (t === 0) { const a = ri(2, 12); return numP(`${sq(a)} = ?`, a * a, { min: 0, wrong: [a * 2, a * a + a, (a + 1) * (a + 1)], hint: `${sq(a)} means ${a} × ${a}.`, explain: `${a} × ${a} = ${a * a}` }); }
    if (t === 1) { const n = ri(2, 7); return numP(`2<sup>${n}</sup> = ?`, 2 ** n, { min: 0, wrong: [2 * n, 2 ** (n - 1), n * n], hint: `Multiply 2 by itself ${n} times.`, explain: `${Array(n).fill(2).join(' × ')} = ${2 ** n}` }); }
    const r = ri(2, 12);
    return numP(`√${r * r} = ?`, r, { min: 0, wrong: [r * r / 2, r + 1, r - 1], hint: `What number times itself is ${r * r}?`, explain: `${r} × ${r} = ${r * r}` });
  },
  mean: () => {
    const n = ri(3, 5), m = ri(4, 20), arr = []; let sum = 0;
    for (let i = 0; i < n - 1; i++) { const v = m + ri(-4, 4); arr.push(v); sum += v; }
    const last = m * n - sum; if (last < 0) return gen.mean();
    arr.push(last); shuffle(arr);
    return numP(`What is the <b>mean</b> (average) of ${arr.join(', ')}?`, m, { min: 0, wrong: [m * n, m + 1, m - 1, Math.max(...arr)],
      hint: `Add them up (${m * n}) and divide by how many numbers there are (${n}).`, explain: `${m * n} ÷ ${n} = ${m}` });
  },
  evalExpr: () => {
    const x = ri(-3, 5) || 2, a = ri(2, 5), b = ri(1, 9), t = ri(0, 2), xs = P(x);
    if (t === 0) return numP(`If x = ${N(x)}, what is ${a}x + ${b}?`, a * x + b, { wrong: [a + x + b, a * (x + b), -(a * x) + b], hint: `Replace x with ${N(x)}: ${a} × ${xs} + ${b}`, explain: `${a} × ${xs} + ${b} = ${N(a * x + b)}` });
    if (t === 1) return numP(`If x = ${N(x)}, what is ${sq('x')} + ${b}?`, x * x + b, { wrong: [2 * x + b, -x * x + b, x * x - b], hint: `${sq('x')} means x × x = ${xs} × ${xs}`, explain: `${x * x} + ${b} = ${x * x + b}` });
    return numP(`If x = ${N(x)}, what is ${a}${sq('x')} − x?`, a * x * x - x, { wrong: [a * x * x + x, (a * x) ** 2 - x, 2 * a * x - x], hint: `Square first: ${xs} × ${xs} = ${x * x}. Then × ${a}, then subtract x.`, explain: `${a} × ${x * x} − ${xs} = ${N(a * x * x - x)}` });
  },
  pctChange: () => {
    const base = pick([20, 40, 50, 80, 100, 200]), p = pick([10, 20, 25, 50, 75]), ch = base * p / 100;
    if (!Number.isInteger(ch)) return gen.pctChange();
    const up = R() < .6, nv = up ? base + ch : base - ch;
    return numP(`A price ${up ? 'goes up' : 'goes down'} from $${base} to $${nv}. What is the percent ${up ? 'increase' : 'decrease'}?`, p,
      { min: 1, step: 5, fmt: v => v + '%', wrong: [ch, Math.round(ch / nv * 100), p * 2], hint: `Percent change = change ÷ original × 100. The change is $${ch}.`, explain: `${ch} ÷ ${base} = ${p}%` });
  },
  slope: () => {
    const m = ri(-4, 5) || 2, x1 = ri(-3, 3), y1 = ri(-5, 5), dx = ri(1, 4), x2 = x1 + dx, y2 = y1 + m * dx;
    return numP(`What is the slope of the line through (${N(x1)}, ${N(y1)}) and (${N(x2)}, ${N(y2)})?`, m, { wrong: [-m, m * dx, dx, y2 + y1],
      hint: 'Slope = (change in y) ÷ (change in x)', explain: `(${N(y2)} − ${P(y1)}) ÷ (${N(x2)} − ${P(x1)}) = ${N(y2 - y1)} ÷ ${dx} = ${N(m)}` });
  },
  func: () => {
    const a = ri(2, 6), b = ri(-9, 9) || 3, x = ri(-3, 6), bs = b < 0 ? `− ${-b}` : `+ ${b}`;
    return numP(`f(x) = ${a}x ${bs}<br>What is f(${N(x)})?`, a * x + b, { wrong: [a + x + b, a * x - b, a * (x + b)], hint: `Put ${N(x)} in for x: ${a} × ${P(x)} ${bs}`, explain: `f(${N(x)}) = ${N(a * x + b)}` });
  },
  slopeInt: () => {
    const m = ri(-6, 6) || 3, b = ri(-9, 9) || -2, bs = b < 0 ? `− ${-b}` : `+ ${b}`, askSlope = R() < .5;
    return numP(`For the line y = ${N(m)}x ${bs}, what is the ${askSlope ? 'slope' : 'y-intercept'}?`, askSlope ? m : b, { wrong: askSlope ? [b, -m] : [m, -b],
      hint: 'In y = mx + b, m is the slope and b is the y-intercept.', explain: `slope = ${N(m)}, y-intercept = ${N(b)}` });
  },
  pythag: () => {
    const [p, q, r] = pick([[3, 4, 5], [5, 12, 13], [8, 15, 17], [6, 8, 10], [9, 12, 15], [7, 24, 25]]);
    if (R() < .6) return numP(`A right triangle has legs ${p} and ${q}. How long is the hypotenuse?`, r, { min: 1, wrong: [p + q, r + 1, r - 1, q - p],
      hint: 'Use a² + b² = c², then take the square root.', explain: `${p * p} + ${q * q} = ${r * r}, and √${r * r} = ${r}` });
    return numP(`A right triangle has hypotenuse ${r} and one leg ${p}. How long is the other leg?`, q, { min: 1, wrong: [r - p, r + p, q + 1],
      hint: 'Use a² + b² = c², so b² = c² − a².', explain: `${r * r} − ${p * p} = ${q * q}, and √${q * q} = ${q}` });
  },
  angles: () => {
    const t = ri(0, 2), deg = v => v + '°';
    if (t === 0) { const a = ri(30, 80), b = ri(30, 80);
      return numP(`Two angles of a triangle are ${a}° and ${b}°. What is the third angle?`, 180 - a - b, { min: 1, fmt: deg, wrong: [360 - a - b, a + b, 90 - Math.abs(a - b)], hint: 'The angles in a triangle add up to 180°.', explain: `180 − ${a} − ${b} = ${180 - a - b}°` }); }
    if (t === 1) { const a = ri(20, 160);
      return numP(`Two angles make a straight line. One is ${a}°. What is the other?`, 180 - a, { min: 1, fmt: deg, wrong: [90 - a, 360 - a, a], hint: 'Angles on a straight line add up to 180°.', explain: `180 − ${a} = ${180 - a}°` }); }
    const r = ri(2, 10);
    return numP(`A circle has radius ${r}. Its area is kπ. What is k?`, r * r, { min: 1, wrong: [2 * r, r, 4 * r * r], hint: 'Area of a circle = π × r².', explain: `π × ${r}² = ${r * r}π` });
  },
  system: () => {
    const x = ri(1, 9), y = ri(1, 9);
    if (R() < .5) return numP(`x + y = ${x + y}<br>x − y = ${N(x - y)}<br>What is x?`, x, { min: 0, wrong: [y, x + y, x - y], hint: 'Add the two equations together and y disappears! Then divide by 2.', explain: `2x = ${2 * x}, so x = ${x}` });
    const a = ri(2, 4);
    return numP(`y = ${a}x<br>x + y = ${x * (a + 1)}<br>What is x?`, x, { min: 0, wrong: [a * x, x + 1, x * (a + 1)], hint: `Replace y with ${a}x: x + ${a}x = ${x * (a + 1)}, so ${a + 1}x = ${x * (a + 1)}.`, explain: `x = ${x * (a + 1)} ÷ ${a + 1} = ${x}` });
  },
  inequality: () => {
    const a = ri(2, 6), x = ri(1, 9), b = ri(1, 12), c = a * x + b, gt = R() < .5, s = gt ? '>' : '<';
    return strP(`Solve: ${a}x + ${b} ${s} ${c}`, `x ${s} ${x}`, [`x ${gt ? '<' : '>'} ${x}`, `x ${s} ${c - b}`, `x ${s} ${x + b}`, `x ${s} ${Math.round((c + b) / a * 10) / 10}`, `x ${s} ${x + 1}`, `x ${gt ? '<' : '>'} ${c - b}`],
      { hint: `Treat it like an equation: subtract ${b}, then divide by ${a}.`, explain: `${a}x ${s} ${c - b}, so x ${s} ${x}` });
  },
  quad: () => {
    const r1 = ri(-6, 8), r2 = ri(-6, 8);
    if (r1 === r2 || r1 === 0 || r2 === 0) return gen.quad();
    const B = -(r1 + r2), C = r1 * r2;
    const term = (c, v) => c === 0 ? '' : (c < 0 ? ` − ${(-c === 1 && v) ? '' : -c}${v}` : ` + ${(c === 1 && v) ? '' : c}${v}`);
    const fac = r => r < 0 ? `(x + ${-r})` : `(x − ${r})`;
    const big = Math.max(r1, r2);
    return numP(`${sq('x')}${term(B, 'x')}${term(C, '')} = 0<br>What is the <b>larger</b> solution?`, big, { wrong: [-big, Math.min(r1, r2), -Math.min(r1, r2), C],
      hint: `Find two numbers that multiply to ${N(C)} and add to ${N(-B)}.`, explain: `${fac(r1)}${fac(r2)} = 0, so x = ${N(r1)} or ${N(r2)}` });
  },
  expRules: () => {
    const a = ri(2, 6), b = ri(2, 6), t = ri(0, 2);
    if (t === 0) return numP(`x<sup>${a}</sup> · x<sup>${b}</sup> = x<sup>?</sup>`, a + b, { min: 0, wrong: [a * b, Math.abs(a - b), a + b + 1], hint: 'Multiplying powers with the same base? ADD the exponents.', explain: `${a} + ${b} = ${a + b}` });
    if (t === 1) return numP(`(x<sup>${a}</sup>)<sup>${b}</sup> = x<sup>?</sup>`, a * b, { min: 0, wrong: [a + b, a ** b, a * b - 1], hint: 'A power of a power? MULTIPLY the exponents.', explain: `${a} × ${b} = ${a * b}` });
    return numP(`x<sup>${a + b}</sup> ÷ x<sup>${b}</sup> = x<sup>?</sup>`, a, { min: 0, wrong: [(a + b) * b, a + 2 * b, b], hint: 'Dividing powers with the same base? SUBTRACT the exponents.', explain: `${a + b} − ${b} = ${a}` });
  },
  satModel: () => {
    const s = ri(2, 9), g = ri(2, 6);
    if (s === g) return gen.satModel();
    const [txt, V, X, desc] = pick([
      [`A plant is ${s} cm tall and grows ${g} cm each week.`, 'h', 'w', 'its height h after w weeks'],
      [`Miles has $${s} and saves $${g} each week.`, 'S', 'w', 'his savings S after w weeks'],
      [`A taxi ride costs $${s} plus $${g} per mile.`, 'C', 'm', 'the cost C for m miles']]);
    return strP(`${txt} Which equation gives ${desc}?`, `${V} = ${g}${X} + ${s}`, [`${V} = ${s}${X} + ${g}`, `${V} = ${s + g}${X}`, `${V} = ${g}${X} − ${s}`, `${V} = ${s}${X}`],
      { hint: 'The starting amount is added once. The amount that repeats gets multiplied by the variable.', explain: `Start at ${s} and add ${g} each time: ${V} = ${g}${X} + ${s}` });
  },
  prob: () => {
    const r = ri(2, 7), b = ri(1, 7), tot = r + b, [c1, c2] = pick([['red', 'blue'], ['green', 'yellow'], ['striped', 'spotted']]);
    return strP(`A bag has ${r} ${c1} marbles and ${b} ${c2} marbles. You pick one without looking. What is the probability it is ${c1}?`, fr(r, tot),
      [fr(b, tot), fr(r, b), fr(1, tot), fr(r, tot + 1)], { hint: 'Probability = (ways to win) ÷ (total possible).', explain: `${r} ${c1} out of ${tot} total` });
  },
  satTrick: () => {

function solidAt(px, py) { const tx = Math.floor(px / TS), ty = Math.floor(py / TS); return SOLID[tget(tx, ty)] || entAt.has(ty * W + tx); }
function boxFree(x, y, hw, hh) { return !(solidAt(x - hw, y - hh) || solidAt(x + hw, y - hh) || solidAt(x - hw, y) || solidAt(x + hw, y)); }
function moveEnt(e, dx, dy, hw, hh) {
  let bx = false, by = false;
  if (dx) { if (boxFree(e.x + dx, e.y, hw, hh)) e.x += dx; else bx = true; }
  if (dy) { if (boxFree(e.x, e.y + dy, hw, hh)) e.y += dy; else by = true; }
  return { bx, by };
}
// Slide around corners so the player doesn't snag on tile edges
function nudge(p, axis, dir, amt) {
  for (let k = 1; k <= 8; k++) for (const s of [1, -1]) {
    const nx = axis === 'x' ? p.x + s * k : p.x, ny = axis === 'y' ? p.y + s * k : p.y;
    const tx = axis === 'x' ? nx : nx + dir, ty = axis === 'y' ? ny : ny + dir;
    if (boxFree(nx, ny, 5, 6) && boxFree(tx, ty, 5, 6)) { if (axis === 'x') p.x += s * Math.min(k, amt); else p.y += s * Math.min(k, amt); return; }
  }
}

function inputVec() {
  let x = 0, y = 0;
  if (keys.arrowleft || keys.a) x--; if (keys.arrowright || keys.d) x++;

function trailPush() {
  const l = trail[trail.length - 1];
  if (!l || Math.hypot(l.x - player.x, l.y - player.y) >= 2) { trail.push({ x: player.x, y: player.y }); if (trail.length > 40) trail.shift(); }
}
function updateCamera() {

  cam.y = clamp(player.y - 8 - BH / 2, 0, Math.max(0, H * TS - BH));
}
function updateWorld(dt) {
  const p = player, v = inputVec(), sp = 70;
  p.moving = v.m > 0;
  if (p.moving) {
    if (!movedOnce) { movedOnce = true; setTimeout(() => $('touchHint').classList.add('hidden'), 600); }
    p.dir = Math.abs(v.x) > Math.abs(v.y) ? (v.x > 0 ? 'right' : 'left') : (v.y > 0 ? 'down' : 'up');
    p.anim += dt;
    const dx = v.x * sp * dt, dy = v.y * sp * dt, ox = p.x, oy = p.y;
    const res = moveEnt(p, dx, dy, 5, 6);
    if (res.bx && Math.abs(v.y) < 0.35) nudge(p, 'y', Math.sign(dx), sp * dt);
    if (res.by && Math.abs(v.x) < 0.35) nudge(p, 'x', Math.sign(dy), sp * dt);

  updateMonsters(dt);
  updateCamera();

function updateMiles(dt) {

  const dx = tgt.x - miles.x, dy = tgt.y - miles.y, d = Math.hypot(dx, dy);

    const st = Math.min(d, 95 * dt); miles.x += dx / d * st; miles.y += dy / d * st;

function burst(x, y, n, colors, o = {}) {
  for (let i = 0; i < n; i++) {
    const a = R() * Math.PI * 2, s = (o.speed || 60) * (0.4 + R() * 0.8), life = (o.life || 0.8) * (0.7 + R() * 0.5);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (o.up || 0), life, max: life, c: pick(colors), sz: o.size || 1, g: o.grav ?? 80, star: !!o.star });
  }
}
function updateParts(dt) {
  for (const p of parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; }
  parts = parts.filter(p => p.life > 0);
}
function drawParts(g, ox, oy) {
  for (const p of parts) {
    g.globalAlpha = Math.min(1, p.life / p.max * 2); g.fillStyle = p.c;
    const x = Math.round(p.x - ox), y = Math.round(p.y - oy);
    if (p.star) { g.fillRect(x - 1, y, 3, 1); g.fillRect(x, y - 1, 1, 3); } else g.fillRect(x, y, p.sz, p.sz);
  }
  g.globalAlpha = 1;
}
const flakes = Array.from({ length: 70 }, () => ({ x: R(), y: R(), s: 0.3 + R() * 0.7, ph: R() * 6 }));
function drawSnow(g, dt) {
  g.fillStyle = 'rgba(255,255,255,.9)';
  for (const f of flakes) {
    f.y += f.s * dt * 0.09; f.ph += dt; if (f.y > 1) { f.y = 0; f.x = R(); }
    const x = ((f.x * BW + Math.sin(f.ph) * 6) % BW + BW) % BW, sz = f.s > 0.7 ? 2 : 1;
    g.fillRect(x | 0, (f.y * BH) | 0, sz, sz);
  }
}

function charSprite(set, dir, moving, anim) {

  const arr = dir === 'up' ? set.up : dir === 'down' ? set.down : set.side;
  return { s: arr[f], flip: dir === 'left', bob: f === 1 || f === 2 ? -1 : 0 };
}
function shadow(g, x, y, w = 5) { g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(Math.round(x), Math.round(y), w, 2, 0, 0, Math.PI * 2); g.fill(); }
function drawMark(g, x, y) {
  const by = Math.round(y + Math.sin(time * 5) * 1.5);
  g.fillStyle = '#2b1b17'; g.fillRect(x - 2, by - 1, 5, 9);
  g.fillStyle = '#ffd84a'; g.fillRect(x - 1, by, 3, 4); g.fillRect(x - 1, by + 5, 3, 2);
}
function drawMonster(g, m, x, y, sc = 1, overworld = true) {
  const s = SPR[m.kind];
  if (m.kind === 'bat') {
    const fly = Math.sin(m.ph * 8) > 0;
    const yy = y - (overworld ? 6 : 0) + Math.sin(m.ph * 3) * 2 * sc;
    g.save(); g.translate(Math.round(x), Math.round(yy)); g.scale(sc, sc * (fly ? 1 : 0.75));
    g.drawImage(s, -8, -12); g.restore();
  } else if (m.kind === 'slime' || m.kind === 'ice') {
    const q = 1 + Math.sin(m.ph * 6) * 0.1;
    g.save(); g.translate(Math.round(x), Math.round(y)); g.scale(sc / q, sc * q); g.drawImage(s, -8, -16); g.restore();
  } else {
    const bob = Math.round(Math.abs(Math.sin(m.ph * 4)) * -1 * sc);
    drawSpr(g, s, x - 8 * sc, y - 16 * sc + bob, Math.sin(m.ph * 0.7) > 0, sc);
  }
}
function renderWorld(dt) {
  const g = bctx, cx = Math.round(cam.x), cy = Math.round(cam.y), frame = Math.floor(time * 2) % 4;

  for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) g.drawImage(getTile(tx, ty, frame), tx * TS - cx, ty * TS - cy);

  const list = [];
  const vis = (x, y) => x > cx - 40 && x < cx + BW + 40 && y > cy - 40 && y < cy + BH + 60;
  list.push({ y: 46 * TS, d: () => g.drawImage(HOUSE, 36 * TS - cx, 43 * TS - 5 - cy) });
  for (const f of FOUNTAINS) if (vis(f.x * TS, f.y * TS)) list.push({ y: (f.y + 1) * TS, d: () => drawFountain(g, f.x * TS - cx, f.y * TS - cy) });
  for (const c of CHESTS) if (vis(c.x * TS, c.y * TS)) list.push({ y: (c.y + 1) * TS - 1, d: () => {
    const spr = S.chests[c.id] ? SPR.chestOpen : (c.crown ? SPR.crown : SPR.chest);
    g.drawImage(spr, c.x * TS - cx, c.y * TS - cy);
    if (!S.chests[c.id] && Math.floor(time * 2 + c.x) % 3 === 0) { g.fillStyle = '#fff'; g.fillRect(c.x * TS - cx + 12, c.y * TS - cy + 4, 1, 1); }
  } });
  for (const s of SIGNS) if (vis(s.x * TS, s.y * TS)) list.push({ y: (s.y + 1) * TS - 1, d: () => g.drawImage(SPR.sign, s.x * TS - cx, s.y * TS - cy) });
  const near = (x, y) => Math.hypot(player.x - x, player.y - y) < 3 * TS;
  for (const n of NPCS) if (vis(n.x * TS, n.y * TS)) list.push({ y: (n.y + 1) * TS - 1, d: () => {
    const px = n.x * TS - cx, py = n.y * TS - cy;
    shadow(g, px + 8, py + 15);
    if (n.spr === 'mom') { const face = Math.floor(time / 3) % 2 ? MOM.down[0] : MOM.side[0]; drawSpr(g, face, px, py - 1, Math.floor(time / 3) % 4 === 1); }
    else g.drawImage(SPR.owl, px, py - 1 + Math.round(Math.sin(time * 3) * 0.6));

  } });
  for (const gt of GATES) if (!S.gates[gt.id] && vis(gt.x * TS, gt.y * TS)) list.push({ y: (gt.y + 2) * TS - 1, d: () => {
    const px = gt.x * TS - cx, py = gt.y * TS - cy, bob = Math.round(Math.sin(time * 2) * 1);
    shadow(g, px + 16, py + 30, 12);
    drawSpr(g, SPR[gt.kind], px, py + bob - 2, false, 2);
    if (near(gt.x * TS + 16, gt.y * TS + 16)) drawMark(g, px + 16, py - 12);
  } });
  for (const m of monsters) if (m.alive && vis(m.x, m.y)) list.push({ y: m.y, d: () => {

  } });
  list.push({ y: miles.y, d: () => {
    const c = charSprite(BEAR, miles.dir, miles.moving, miles.anim);
    shadow(g, miles.x - cx, miles.y - cy, 5); drawSpr(g, c.s, miles.x - 8 - cx, miles.y - 15 - cy + c.bob, c.flip);
  } });
  list.push({ y: player.y + 0.5, d: () => {
    const c = charSprite(GIRL, player.dir, player.moving, player.anim);
    shadow(g, player.x - cx, player.y - cy, 5); drawSpr(g, c.s, player.x - 8 - cx, player.y - 15 - cy + c.bob, c.flip);
  } });
  list.sort((a, b) => a.y - b.y).forEach(o => o.d());

}
function drawFountain(g, x, y) {

  g.fillStyle = '#4aa8ff'; g.fillRect(x + 2, y + 8, 12, 5);
  g.fillStyle = '#bfe9ff'; g.fillRect(x + 3 + (Math.floor(time * 4) % 8), y + 10, 2, 1);
  g.fillStyle = '#8b909c'; g.fillRect(x + 7, y + 3, 2, 7); g.fillStyle = '#3e424c'; g.fillRect(x + 6, y + 2, 4, 1);

  if (Math.floor(time * 3) % 2) { g.fillStyle = '#ffffff'; g.fillRect(x + 13, y + 3, 1, 1); g.fillRect(x + 2, y + 4, 1, 1); }

const BATTLE_SKY = { meadow: ['#7fd0ff', '#d4f1ff'], forest: ['#2e6a4a', '#8ccf9a'], desert: ['#ff9f5a', '#ffe7a8'], snow: ['#8aa8e0', '#eef4ff'], castle: ['#1e1236', '#5a3a6a'] };
function renderBattle(dt) {
  const g = bctx, b = battle, sh = battleSceneH();
  const shake = b.shake > 0 ? Math.round((R() - .5) * 5) : 0;
  g.save(); g.translate(shake, 0);
  const [s1, s2] = BATTLE_SKY[b.reg] || BATTLE_SKY.meadow, hor = Math.round(sh * 0.38);
  const grad = g.createLinearGradient(0, 0, 0, hor); grad.addColorStop(0, s1); grad.addColorStop(1, s2);
  g.fillStyle = grad; g.fillRect(-8, 0, BW + 16, hor + 1);
  if (b.reg === 'castle') {
    for (let x = -16; x < BW + 16; x += 16) g.drawImage(tileRaw(T.WALL, '', 0, 0, 0, 0), x, hor - 16), g.drawImage(tileRaw(T.WALL, '', 0, 0, 0, 0), x, hor - 32);
    for (let x = 24; x < BW; x += 64) { g.fillStyle = '#5a3418'; g.fillRect(x, hor - 22, 2, 6); g.fillStyle = Math.floor(time * 8 + x) % 2 ? '#ffb020' : '#ff6020'; g.fillRect(x - 1, hor - 26, 4, 4); }
    for (let y = hor; y < BH; y += 16) for (let x = -16; x < BW + 16; x += 16) g.drawImage(tileRaw(T.FLOOR, '', 0, 0, 0, ((x + y) / 16) & 1), x, y);
  } else {
    if (b.reg === 'meadow' || b.reg === 'desert') { g.fillStyle = 'rgba(255,255,255,.85)'; const cx = (time * 4) % (BW + 60) - 30; g.fillRect(cx, hor * 0.3, 22, 5); g.fillRect(cx + 5, hor * 0.3 - 3, 12, 3); }
    const treeT = b.reg === 'desert' ? T.CACTUS : T.TREE;
    for (let x = -8; x < BW + 16; x += 14) g.drawImage(tileRaw(treeT, b.reg, 0, 0, 0, 0), x, hor - 14 + ((x / 14) & 1) * 2);
    for (let y = hor; y < BH; y += 16) for (let x = -16; x < BW + 16; x += 16) g.drawImage(tileRaw(T.GRASS, b.reg, ((x / 16) + (y / 16)) & 3, 0, 0, 0), x, y);
  }

  const es = clamp(Math.floor(sh * 0.45 / 16) + (b.boss ? 1 : 0), 2, 8), hs = clamp(Math.floor(sh * 0.3 / 16), 1, 5);
  const a = b.anim, at = a ? a.t : 0;
  let heroDX = 0, milesDX = 0, enemyDX = 0;
  const lunge = (t0, t1, dist) => at < t0 ? (at / t0) * dist : at < t1 ? (1 - (at - t0) / (t1 - t0)) * dist : 0;

    if (b.heroFlash > 0) gf = tinted(gf, '#ff6a6a');

}

  const acc = S.total ? Math.round(S.correct / S.total * 100) : 0;
  const beaten = GATES.filter(g => S.gates[g.id]).length;
  $('menuStats').innerHTML = `${S.name} &amp; Miles<br>Math Lv <b>${lvlNum()}</b>: ${LEVELS[lvlNum() - 1].name}<br>Problems solved: ${S.correct} of ${S.total} (${acc}%)<br>Bosses beaten: ${beaten} / 4`;
  $('mSound').textContent = `🔊 Sound: ${S.sound ? 'On' : 'Off'}`;
  $('mMusic').textContent = `🎵 Music: ${S.music ? 'On' : 'Off'}`;
}
$('btnMenu').addEventListener('click', toggleMenu);
$('mResume').addEventListener('click', toggleMenu);
$('mSound').addEventListener('click', () => { S.sound = !S.sound; save(); refreshMenu(); });
$('mMusic').addEventListener('click', () => { S.music = !S.music; if (AU.music) AU.music.gain.value = S.music ? 0.32 : 0; save(); refreshMenu(); });
$('mLevel').addEventListener('click', () => { $('menu').classList.add('hidden'); showGradePick('menu'); });
$('mNew').addEventListener('click', () => {
  if (!confirm('Start a brand new adventure? Your current progress will be erased.')) return;
  $('menu').classList.add('hidden'); menuOpen = false; mode = 'title'; $('hud').classList.add('hidden');
  $('nameIn').value = S.name; showGradePick('new');
});
function showVictory() {
  mode = 'victory'; $('hud').classList.add('hidden');
  const acc = S.total ? Math.round(S.correct / S.total * 100) : 0;
  $('winStats').innerHTML = `${S.name} and Miles saved the Kingdom of Numbers!<br>⭐ ${S.stars} stars · ✅ ${S.correct} problems solved (${acc}%)<br>Math Lv <b>${lvlNum()}</b>: ${LEVELS[lvlNum() - 1].name}`;
  $('victory').classList.remove('hidden'); sfx('win');
}
$('vKeep').addEventListener('click', () => { $('victory').classList.add('hidden'); $('hud').classList.remove('hidden'); mode = 'world'; toast('Keep exploring! Monsters still want math battles. 🐻'); });
$('vNew').addEventListener('click', () => { $('victory').classList.add('hidden'); mode = 'title'; $('nameIn').value = S.name; showGradePick('new'); });
document.addEventListener('visibilitychange', () => { if (!AU.ctx) return; if (document.hidden) AU.ctx.suspend(); else AU.ctx.resume(); });

// =====================================================================
// Main loop
// =====================================================================
buildMap();
registerEntities();
spawnMonsters();
respawn();
if (hadSave) { $('btnContinue').classList.remove('hidden'); $('nameIn').value = S.name; }

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  interactCD = Math.max(0, interactCD - dt);
  if (dlg.typing) {
    dlg.shown += dt * 50; $('dlgText').textContent = dlg.full.slice(0, Math.floor(dlg.shown));
    if (dlg.shown >= dlg.full.length) dlg.typing = false;
  }
  if (mode === 'world' && !dlg.active && !menuOpen) updateWorld(dt);
  else if (mode === 'world' || mode === 'victory') { for (const m of monsters) m.ph += dt; }
  if (mode === 'title') {
    cam.x = (Math.sin(time * 0.06) * 0.5 + 0.5) * (W * TS - BW);
    cam.y = clamp(36 * TS - BH / 2 + Math.sin(time * 0.04) * 8 * TS, 0, H * TS - BH);
    for (const m of monsters) m.ph += dt;
  }
  if (mode === 'battle') updateBattle(dt);
  updateParts(dt);
  updateBubble(dt);
  if (mode === 'battle' && battle) renderBattle(dt); else renderWorld(dt);
  ctx.drawImage(buf, 0, 0, BW * SCALE, BH * SCALE);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
